        label: Название EN
        widget: string
      - name: ru
        label: Название RU
        widget: string
      - name: icon
        label: Значок
        widget: string
        required: false
      - name: lead
        label: Описание
        widget: text
      - name: do
        label: Что делает посетитель
        widget: text
      - name: learn
        label: Что узнаёт
        widget: text
