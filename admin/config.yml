        required: false
      - name: icon
        label: Значок
        widget: string
        required: false
      - name: accent
        label: Цвет
        widget: string
        required: false
      - name: desc
        label: Описание
        widget: text
        required: false
      - name: areas
        label: Подзоны
        widget: list
        required: false
