backend:
  name: github
  repo: OWNER/REPOSITORY
  branch: main
media_folder: media
public_folder: /media
collections:
- name: galleries
  label: Галереи
  files:
  - name: cosmic
    label: Cosmic Frontiers · карточки
    file: content/cosmic-frontiers.json
    fields:
    - name: zones
      label: Названия зон
      widget: object
      fields:
      - name: CF1
        label: CF1
        widget: object
        fields: &id001
        - name: en
          label: Название EN
          widget: string
        - name: ru
          label: Официальный перевод RU
          widget: string
      - name: CF2
        label: CF2
        widget: object
        fields: *id001
      - name: CF3
        label: CF3
        widget: object
        fields: *id001
      - name: CF4
        label: CF4
        widget: object
        fields: *id001
      - name: CF5
        label: CF5
        widget: object
        fields: *id001
      - name: CF6
        label: CF6
        widget: object
        fields: *id001
      - name: CF7
        label: CF7
        widget: object
        fields: *id001
    - name: items
      label: Экспонаты
      widget: list
      summary: '{{fields.code}} · {{fields.ru}}'
      fields:
      - name: code
        label: Код
        widget: string
      - name: zone
        label: Код зоны
        widget: string
      - name: en
        label: Название EN
        widget: string
      - name: ru
        label: Название RU
        widget: string
      - name: summaryRu
        label: Краткое описание RU
        widget: text
        required: false
      - name: actionsRu
        label: Действия посетителя RU
        widget: text
        required: false
      - name: learnRu
        label: Что узнает RU
        widget: text
        required: false
      - name: detailRu
        label: Для эдьюкейтора RU
        widget: text
        required: false
      - name: story
        label: Описание EN
        widget: text
        required: false
      - name: actions
        label: Действия EN
        widget: list
        required: false
      - name: learn
        label: Результат EN
        widget: text
        required: false
      - name: type
        label: Тип
        widget: string
        required: false
      - name: remarks
        label: Примечания
        widget: text
        required: false
      - name: ref
        label: Источник
        widget: string
        required: false
      - name: image
        label: Изображение / встроенные данные
        widget: text
        required: false
      - name: panels
        label: Тексты панелей
        widget: list
        required: false
        fields:
        - name: code
          label: Код
          widget: string
        - name: type
          label: Тип
          widget: string
        - name: ru
          label: Текст RU
          widget: text
        - name: en
          label: Текст EN
          widget: text
        - name: ref
          label: Источник
          widget: string
    - name: plan
      label: Встроенные изображения и схема
      widget: text
      required: false
  - name: earth_zones
    label: Earth Explorers · зоны
    file: content/earth-zones.json
